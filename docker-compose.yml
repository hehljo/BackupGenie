version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backupgenie-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=sqlite:////data/backupgenie.db
      - BACKUP_BASE_PATH=/mnt/backup
      - MAX_PARALLEL_TASKS=${MAX_PARALLEL_TASKS:-2}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - SOURCES_CONFIG_PATH=/app/config/sources.json
      - RCLONE_CONFIG_PATH=/app/config/rclone.conf
      # Credentials from secrets file
      - NAS_PASSWORD_1=${NAS_PASSWORD_1:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RCLONE_CONFIG_GDRIVE_TOKEN=${RCLONE_CONFIG_GDRIVE_TOKEN:-}
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ${BACKUP_BASE_PATH:-/mnt/backup}:/mnt/backup
      - ./logs:/var/log/backupgenie
    networks:
      - backupgenie
    privileged: true  # Required for mounting SMB/NFS shares
    cap_add:
      - SYS_ADMIN  # Required for mount operations
    devices:
      - /dev/fuse  # Required for some mount operations

  frontend:
    build: ./frontend
    container_name: backupgenie-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - backupgenie

networks:
  backupgenie:
    driver: bridge

volumes:
  data:
  logs:
